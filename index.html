<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-dark">
    <div class="container text-white my-5">
            <h1>Agrega Estudiantes y Profesores</h1>

            <div class="alert alert-danger my-2 d-none" role="alert">
                Todos los campos son obligatorios
            </div>

            <form id="form">
                <input class="form-control mb-2" type="text" placeholder="Ingrese su nombre" value="jermy" name="nombre" required>
                <input class="form-control mb-2" type="number" placeholder="Ingrese su edad"  value="22" name="edad" required>
                <select class="form-select mb-2" name="rol">
                    <option value="Estudiante" selected>Estudiante</option>
                    <option value="Profesor">Profesor</option>
                </select>
                <button type="submit" class="btn btn-primary mb-3">Agregar</button>
            </form>

            <!-- seccion de agregados  -->

            <section class="row my-3">

                <!-- fila de estudiantes  -->
                <div class="col-6" id="columnaEstudiantes">
                 
                </div>
                   
                <!-- fila de profesores  -->
                <div class="col-6" id="columnaProfesores">
                    
                </div>


            </section>
    </div>

<!-- templates  -->

<template id="cardEstudiante">
    <article class="card mb-2">
        <div class="card-body">
            <h5>
                <span class="text-primary">Nombre</span>
                <span class="badge bg-success">Aprobado</span>
            </h5>
            <h6></h6>
            <p class="lead">edad</p>
            <button class="btn btn-success">Aprobar</button>
            <button class="btn btn-danger">Reprobar</button>
        </div>
    </article>
</template>

<template id="cardProfesores">
    <article class="card mb-2 bg-info text-white">
        <div class="card-body ">
            <h5>nombre</h5>
            <h6>profesor</h6>
            <p class="lead">edad</p>
        </div>
    </article>
</template>



<script src="app.js"></script>
</body>
</html>
